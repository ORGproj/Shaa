services:
  - type: web
    name: student-management-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --preload --workers 2 --threads 4 --timeout 60 app:app
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: APP_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "1"
      # Render will prompt you for these on the first Blueprint deploy.
      # Use a unique admin username and a strong password (12+ chars).
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: student-management-db
          property: connectionString
databases:
  - name: student-management-db
    databaseName: student_management
    user: student_management_user
