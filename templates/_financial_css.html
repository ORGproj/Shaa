<style>
/* Financial reports: a white "paper" sheet in both themes so it looks like (and prints as) the real document. */
.fr-paper{background:#fff;color:#111;border-radius:12px;padding:26px 30px 30px;max-width:980px;margin:0 auto 18px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.08)}
.fr-paper.wide{max-width:100%}
.fr-paper *{color:inherit}
.fr-head{display:flex;gap:14px;align-items:center;border-bottom:3px double #333;padding-bottom:10px;margin-bottom:14px}
.fr-head img{width:58px;height:58px;object-fit:contain}
.fr-head .fr-school{font-weight:800;letter-spacing:.04em;font-size:1rem;line-height:1.2}
.fr-head .fr-dept{font-size:.8rem;opacity:.75}
.fr-head .fr-stamp{margin-left:auto;font-size:.78rem;text-align:right;opacity:.75}
.fr-title{font-size:1.9rem;line-height:1.1;margin:.2rem 0 .1rem;font-weight:800;color:#111}
.fr-sub{margin:0 0 12px;font-size:.92rem;color:#444!important}
.fr-scroll{overflow-x:auto}
.fr-table{width:100%;border-collapse:collapse;font-size:.92rem;color:#111;border:1px solid #333}
.fr-paper .fr-table th{background:#f3f4f6!important;color:#111!important;border:1px solid #333;text-transform:none;letter-spacing:0;font-size:.82rem;padding:6px 8px;text-align:right;white-space:nowrap}
.fr-paper .fr-table th:first-child{text-align:left}
.fr-paper .fr-table td{border:0;border-bottom:1px solid #e5e7eb;padding:2px 8px;color:#111;font-size:.9rem;background:transparent}
.fr-paper .fr-table tbody:last-child tr:last-child td{border-bottom:0}
.fr-headrow td{font-weight:800;color:#9b1c1c!important;border-bottom:2px solid #9b1c1c!important;padding-top:12px!important}
.fr-headrow.band td{background:#9b1c1c!important;color:#fff!important;border:0!important;letter-spacing:.05em;padding:4px 8px!important}
.fr-gap td{height:12px;padding:0!important;border:0!important}
.fr-group td{font-weight:800;background:#fdf1e8!important;padding-top:5px!important;padding-bottom:5px!important}
.fr-group small{font-weight:500;opacity:.65;margin-left:6px}
.fr-label{width:100%;min-width:200px}
.fr-bold td{font-weight:800}
.fr-num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:110px}
.fr-wide-cols .fr-num{min-width:78px}
.fr-wrap{display:flex;align-items:center;justify-content:flex-end}
.fr-paren::before{content:"("}.fr-paren::after{content:")"}
.fr-paren:has(input:placeholder-shown)::before,.fr-paren:has(input:placeholder-shown)::after{content:""}
.fr-paper input.fr-in,.fr-paper input.fr-lab,.fr-paper input.fr-plain{background:transparent!important;color:#111!important;border:0!important;border-bottom:1px dotted #9ca3af!important;border-radius:0!important;margin:0!important;padding:2px 4px!important;font:inherit;box-shadow:none!important;min-height:0;height:auto}
.fr-paper input.fr-in{text-align:right;width:100%;min-width:70px;font-variant-numeric:tabular-nums}
.fr-paper input.fr-lab{width:100%;text-align:left}
.fr-paper input.fr-in::placeholder{color:#b6bcc6!important;opacity:1}
.fr-paper input.fr-in:focus,.fr-paper input.fr-lab:focus{background:#fff8d6!important;outline:2px solid #e0b650;outline-offset:0}
.fr-paper input.fr-in[readonly],.fr-paper input.fr-lab[readonly]{border-bottom-color:transparent!important}
.fr-paper input.fr-invalid{background:#fde8e6!important;outline:2px solid #c1121f}
.fr-total td{font-weight:800;border-top:1px solid #333!important}
.fr-calc td{font-weight:800}
.fr-calc.grand td{border-top:2px solid #111!important;border-bottom:3px double #111!important;background:#f3f4f6!important}
.fr-extra{font-weight:700}
.fr-paper .fr-bad,.fr-paper .fr-bad *{color:#c1121f!important}
.fr-x{width:30px;padding:0 4px!important;text-align:center}
.fr-table:not(.fr-editing) .fr-x,.fr-table:not(.fr-editing) .fr-addrow{display:none}
.fr-del{border:0;background:transparent;color:#9ca3af!important;font-size:1.1rem;cursor:pointer;line-height:1;padding:2px 6px}
.fr-del:hover{color:#c1121f!important}
.fr-addrow td{border:0!important;padding:2px 8px 6px!important}
.fr-add{border:1px dashed #9ca3af;background:transparent;color:#374151!important;border-radius:6px;padding:2px 10px;font-size:.78rem;cursor:pointer}
.fr-add:hover{background:#f3f4f6}
.fr-check{margin:12px 0 0;padding:8px 12px;border-radius:8px;font-size:.85rem;font-weight:700}
.fr-check.ok{background:#e8f7ef;color:#087443!important}.fr-check.off{background:#fff0ee;color:#b42318!important}
.fr-hint{font-size:.8rem;color:#555!important;margin:10px 0 0}
.fr-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:44px;text-align:center;font-size:.8rem}
.fr-sign div{border-top:1px solid #111;padding-top:4px}
.fr-notes{margin:0 0 12px;padding:10px 14px;border-left:4px solid #e0b650;border-radius:6px;background:rgba(224,182,80,.12)}
.fr-period{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.fr-period select{width:auto;min-width:120px;margin:0}
.fr-period label{margin:0 0 4px}
/* billing statement */
.st-top{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;margin:6px 0 18px}
.st-top h3,.st-box h3{margin:0 0 4px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#444!important}
.st-bill b{display:block;font-size:1.05rem}
.st-meta{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:.88rem;align-self:start}
.st-meta span{text-align:right;font-weight:700}
.st-two{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;margin-bottom:18px}
.st-box{border:1px solid #cbd0d8;border-radius:6px;padding:10px 12px}
.st-box.sum{background:#eef1fb}
.st-balance{font-size:1.5rem;font-weight:800;color:#9b1c1c!important}
.st-enclosed{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:700}
.st-enclosed i{display:inline-block;width:110px;height:22px;border:1px solid #333;background:#fff}
.st-table{width:100%;border-collapse:collapse;font-size:.88rem}
.fr-paper .st-table th{background:#27407a!important;color:#fff!important;border:0;font-size:.74rem;letter-spacing:.05em;padding:6px 8px;text-align:left;text-transform:uppercase}
.fr-paper .st-table th.n,.st-table td.n{text-align:right;font-variant-numeric:tabular-nums}
.fr-paper .st-table td{border:0;border-bottom:1px solid #d5d9e0;padding:5px 8px;color:#111;background:transparent}
.fr-paper .st-table tfoot td{font-weight:800;border-top:2px solid #27407a;background:#eef1fb}
.st-edit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.st-charge{display:grid;grid-template-columns:150px 1fr 160px 36px;gap:8px;align-items:center;margin-bottom:8px}
.st-charge input{margin:0}
.st-charge button{height:38px}
textarea.st-text{width:100%;min-height:78px;margin-bottom:14px;padding:11px 12px;border:1px solid #d0d5dd;border-radius:8px;font:inherit;background:#fff;color:var(--text)}
html[data-theme="dark"] textarea.st-text{background:var(--surface-2);border-color:var(--border-strong);color:var(--text)}
.fr-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-bottom:20px}
.fr-card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.fr-card .num{font-size:.7rem;font-weight:800;letter-spacing:.12em;color:#c99a2e}
.fr-card h3{margin:0;font-size:1.1rem;color:var(--primary)}
.fr-card p{margin:0;color:var(--muted);font-size:.85rem;flex:1}
.fr-card .state{font-size:.75rem;font-weight:700}
.fr-card .state.on{color:var(--success)}.fr-card .state.off{color:var(--muted)}
@media(max-width:700px){.st-top,.st-two,.st-edit-grid{grid-template-columns:1fr}.st-charge{grid-template-columns:1fr 1fr}.fr-paper{padding:18px 14px}}
@media print{
 @page{size:A4;margin:12mm}
 @page fr-land{size:A4 landscape;margin:10mm}
 .fr-paper.wide{page:fr-land}
 html,body,.app-page{background:#fff!important;color:#000!important}
 .topbar,.navbar,.no-print,.flash-stack,.theme-corner,.page-heading,.panel.no-print{display:none!important}
 .container{max-width:none!important;padding:0!important;margin:0!important}
 .fr-paper{box-shadow:none!important;border:0!important;border-radius:0;padding:0;max-width:none;margin:0}
 .fr-paper input.fr-in,.fr-paper input.fr-lab{border-bottom:0!important}
 .fr-table,.fr-paper .fr-table th,.fr-paper .fr-table td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .fr-headrow.band td,.fr-calc.grand td,.fr-group td,.fr-paper .st-table th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .fr-scroll{overflow:visible}
 .fr-total,.fr-calc,.st-box{break-inside:avoid}
}
</style>
